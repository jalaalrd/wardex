<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 140 685 215">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="hexHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background cropped to content area -->
  <rect x="35" y="140" width="685" height="215" fill="#08090e"/>

  <g id="icon">
    <polygon points="277,252 221,349 109,349 53,252 109,155 221,155" fill="url(#hexGrad)"/>
    <polygon points="277,252 221,155 165,155 109,155 53,252 165,252" fill="url(#hexHighlight)"/>
    <line x1="109" y1="349" x2="221" y2="349" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <line x1="109" y1="349" x2="53"  y2="252" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="221" y1="349" x2="277" y2="252" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <text x="165" y="293" text-anchor="middle" font-family="'Arial Black', Impact, Arial, sans-serif" font-weight="900" font-size="112" fill="#f0ecff">W</text>
  </g>

  <line x1="308" y1="150" x2="308" y2="350" stroke="#ffffff" stroke-width="1" opacity="0.07"/>

  <g id="wordmark">
    <text x="336" y="282" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-weight="900" font-size="82" fill="#f0ecff" letter-spacing="-1">WARDEX</text>
  </g>

  <g id="tagline">
    <text x="339" y="317" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#c4b5fd" letter-spacing="5">DAO TREASURY INTELLIGENCE</text>
  </g>
</svg>
