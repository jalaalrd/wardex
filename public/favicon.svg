<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="hexHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#08090e"/>

  <!-- FLAT-TOP HEXAGON centered at (256, 256), radius=186 -->
  <!-- Points: (442,256) (371,418) (141,418) (70,256) (141,94) (371,94) -->
  <polygon
    points="442,256 371,418 141,418 70,256 141,94 371,94"
    fill="url(#hexGrad)"
  />

  <!-- Inner highlight (top half) -->
  <polygon
    points="442,256 371,94 256,94 141,94 70,256 256,256"
    fill="url(#hexHighlight)"
  />

  <!-- Green bottom-edge trim -->
  <line x1="141" y1="418" x2="371" y2="418" stroke="#10b981" stroke-width="7"  stroke-linecap="round"/>
  <line x1="141" y1="418" x2="70"  y2="256" stroke="#10b981" stroke-width="4"  stroke-linecap="round" opacity="0.5"/>
  <line x1="371" y1="418" x2="442" y2="256" stroke="#10b981" stroke-width="4"  stroke-linecap="round" opacity="0.5"/>

  <!-- Bold W — centered at (256, 256), font-size=210 -->
  <!-- cap-height ~147px, baseline = 256+74 = 330 -->
  <text
    x="256"
    y="332"
    text-anchor="middle"
    font-family="'Arial Black', Impact, Arial, sans-serif"
    font-weight="900"
    font-size="210"
    fill="#f0ecff"
  >W</text>
</svg>
